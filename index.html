<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dermato | AI Dermatology Interface</title>
    
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>

    <style>
        /* --------------------------------------------------
           THEME & VARIABLES
           -------------------------------------------------- */
        :root {
            --color-bg: #050505;
            --color-surface: #0f0f0f;
            --color-primary: #009688;       
            --color-primary-dim: rgba(0, 150, 136, 0.1);
            --color-secondary: #004d61;     
            --color-text-main: #e0e0e0;
            --color-text-dim: #94a3b8;
            
            /* FONT STACK */
            --font-display: 'Orbitron', sans-serif;
            --font-ui: 'Rajdhani', sans-serif;
            --font-code: 'JetBrains Mono', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            cursor: none !important; 
        }

        html { scroll-behavior: smooth; }

        body {
            background-color: var(--color-bg);
            color: var(--color-text-main);
            font-family: var(--font-ui);
            font-size: 18px;
            font-weight: 500;
            overflow-x: hidden;
            line-height: 1.6;
        }

        /* --------------------------------------------------
           CUSTOM CURSOR (JS LERP PHYSICS)
           -------------------------------------------------- */
        .cursor-dot, .cursor-outline {
            position: fixed; top: 0; left: 0;
            border-radius: 50%; z-index: 10000; pointer-events: none;
        }
        
        .cursor-dot { 
            width: 6px; height: 6px; 
            margin-top: -3px; margin-left: -3px; 
            background-color: var(--color-primary); 
            transition: background-color 0.2s ease;
        }
        
        .cursor-outline {
            width: 30px; height: 30px; 
            margin-top: -15px; margin-left: -15px; 
            border: 1px solid var(--color-primary);
            transition: width 0.3s ease, height 0.3s ease, margin 0.3s ease, background-color 0.3s ease, border-color 0.3s ease;
        }
        
        body.hovering .cursor-outline {
            width: 45px; height: 45px; 
            margin-top: -22.5px; margin-left: -22.5px; 
            background-color: rgba(0, 150, 136, 0.1); 
            border-color: #fff;
        }

        /* --------------------------------------------------
           BOOT SCREEN
           -------------------------------------------------- */
        #boot-screen {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            background: #000; z-index: 9000;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            font-family: var(--font-code); color: var(--color-primary);
        }
        .boot-text { font-size: 0.9rem; margin-bottom: 0.5rem; opacity: 0; }
        .loader-line {
            width: 0%; height: 2px;
            background: var(--color-primary); margin-top: 20px;
            box-shadow: 0 0 10px var(--color-primary);
        }

        /* --------------------------------------------------
           TYPOGRAPHY UPDATES
           -------------------------------------------------- */
        h1 {
            font-family: var(--font-display);
            font-weight: 900;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        h2, h3 { 
            font-family: var(--font-ui);
            font-weight: 700; 
            letter-spacing: 0.02em;
            text-transform: uppercase;
        }
        
        h2 {
            font-size: 3rem;
            margin-bottom: 2rem;
            text-align: center;
            min-height: 3.5rem; 
            color: #fff;
        }

        a { text-decoration: none; color: inherit; }

        /* --------------------------------------------------
           COMPONENTS
           -------------------------------------------------- */
        .btn {
            display: inline-block; padding: 1rem 2.5rem;
            background: rgba(0, 150, 136, 0.1);
            border: 1px solid var(--color-primary);
            color: var(--color-primary);
            font-family: var(--font-code);
            font-weight: 700; text-transform: uppercase; letter-spacing: 2px;
            position: relative; overflow: hidden;
            transition: all 0.3s ease;
        }
        .btn::before {
            content: ''; position: absolute; top: 0; left: -100%;
            width: 100%; height: 100%; background: var(--color-primary);
            transition: transform 0.4s ease; z-index: -1;
        }
        .btn:hover { color: #000; box-shadow: 0 0 20px var(--color-primary); }
        .btn:hover::before { transform: translateX(100%); }

        .container { max-width: 1200px; margin: 0 auto; padding: 0 2rem; }

        /* --------------------------------------------------
           HEADER
           -------------------------------------------------- */
        header {
            position: fixed; top: 0; width: 100%; padding: 1.5rem 0;
            background: rgba(5, 5, 5, 0.85); backdrop-filter: blur(10px);
            z-index: 1000; border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            transform: translateY(-100%);
        }
        .header-inner { display: flex; justify-content: space-between; align-items: center; }
        
        .logo { 
            font-family: var(--font-display);
            font-weight: 700; font-size: 1.5rem; 
            display: flex; align-items: center; gap: 10px; 
            letter-spacing: 0.1em;
        }

        .status-badge {
            font-family: var(--font-code); font-size: 0.75rem;
            background: var(--color-primary-dim); color: var(--color-primary);
            padding: 4px 8px; border-radius: 4px;
            border: 1px solid rgba(0, 150, 136, 0.3);
        }

        nav ul { display: flex; gap: 2rem; list-style: none; }
        nav a { 
            font-size: 1rem; color: var(--color-text-dim); 
            transition: color 0.3s; 
            font-family: var(--font-ui);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        nav a:hover { color: var(--color-primary); }

        /* --------------------------------------------------
           HERO SECTION & VFX CANVASES
           -------------------------------------------------- */
        .hero {
            height: 100vh; display: flex; align-items: center; justify-content: center;
            text-align: center; position: relative; overflow: hidden;
            background-image: 
                linear-gradient(rgba(0, 150, 136, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 150, 136, 0.05) 1px, transparent 1px);
            background-size: 50px 50px;
            background-position: top left;
        }
        
        #grid-canvas {
            position: absolute; 
            top: 0; left: 0; 
            width: 100%; height: 100%;
            z-index: 1; 
            pointer-events: none; 
        }

        #particle-canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 2; 
            pointer-events: none;
        }
        
        .hero-content { position: relative; z-index: 3; max-width: 800px; opacity: 0; }
        .hero h1 { font-size: clamp(3rem, 6vw, 6rem); margin-bottom: 1rem; text-shadow: 0 0 20px rgba(0, 150, 136, 0.3); }
        .ai-icon { font-size: 4rem; margin-bottom: 1rem; display: inline-block; filter: drop-shadow(0 0 15px var(--color-primary)); }

        /* --------------------------------------------------
           LIVE TERMINAL DEMO
           -------------------------------------------------- */
        #terminal-demo { padding: 4rem 0; background: #080808; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .terminal-window {
            background: rgba(0,0,0,0.8); border: 1px solid #333; border-radius: 8px;
            padding: 2rem; font-family: var(--font-code); max-width: 800px;
            margin: 0 auto; box-shadow: 0 0 30px rgba(0,0,0,0.5); position: relative;
            min-height: 250px;
        }
        .terminal-header {
            position: absolute; top: 0; left: 0; width: 100%; height: 25px;
            background: #1a1a1a; border-bottom: 1px solid #333; border-radius: 8px 8px 0 0;
            display: flex; align-items: center; padding-left: 10px; gap: 5px;
        }
        .dot { width: 10px; height: 10px; border-radius: 50%; background: #555; }
        .dot.red { background: #ff5f56; }
        .dot.yellow { background: #ffbd2e; }
        .dot.green { background: #27c93f; }
        .terminal-body { margin-top: 15px; color: #ccc; font-size: 0.9rem; }
        .user-line { color: #fff; margin-bottom: 10px; }
        .system-line { color: var(--color-primary); margin-bottom: 10px; }
        .typing-cursor::after { content: '█'; animation: blink 1s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

        /* --------------------------------------------------
           FEATURES
           -------------------------------------------------- */
        section { padding: 8rem 0; }
        .features-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem; margin-top: 4rem;
        }
        .feature-card {
            background: rgba(20, 20, 20, 0.6); backdrop-filter: blur(10px);
            padding: 2.5rem; border-radius: 12px; position: relative; overflow: hidden;
            border: 1px solid rgba(0, 150, 136, 0.3);
            box-shadow: 0 0 10px rgba(0, 150, 136, 0.05), inset 0 0 20px rgba(0, 150, 136, 0.05);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .feature-card:hover {
            transform: translateY(-5px);
            border-color: rgba(0, 150, 136, 0.8);
            box-shadow: 0 0 30px rgba(0, 150, 136, 0.3), inset 0 0 20px rgba(0, 150, 136, 0.1);
        }
        .feature-card h3 {
            color: var(--color-primary); font-family: var(--font-ui);
            font-weight: 700; margin-bottom: 1rem; font-size: 1.5rem;
            text-shadow: 0 0 5px rgba(0, 150, 136, 0.4);
        }
        .feature-card p { font-size: 1.1rem; }

        /* --------------------------------------------------
           DERMATOLOGICAL MAPPING
           -------------------------------------------------- */
        .mapping-section {
            background: radial-gradient(circle at center, #111 0%, #000 100%);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        .mapping-container { display: grid; grid-template-columns: 1fr 1fr; align-items: center; gap: 4rem; }
        
        .scanner-visual {
            position: relative; width: 100%; height: 400px;
            display: flex; justify-content: center; align-items: center;
            background: #000;
            border: 1px solid rgba(0, 150, 136, 0.2); border-radius: 8px;
            overflow: hidden; 
        }
        
        .scanner-image {
            width: 100%; height: 100%;
            object-fit: cover;
            opacity: 0.7; 
            filter: brightness(0.8) contrast(1.1); 
            position: relative;
            z-index: 1;
        }

        .scan-line {
            position: absolute; top: 0; left: 0; width: 100%; height: 2px;
            background: var(--color-primary); box-shadow: 0 0 15px var(--color-primary);
            z-index: 5; opacity: 0.9;
        }
        
        .scanner-label {
            position: absolute; bottom: 10px; left: 10px; 
            font-family: var(--font-code); font-size: 0.7rem; color: var(--color-primary);
            z-index: 6; background: rgba(0,0,0,0.8); padding: 4px 8px; border-radius: 4px;
        }
        
        .data-feed { font-family: var(--font-code); }
        .feed-item {
            background: rgba(255, 255, 255, 0.03); margin-bottom: 1rem; padding: 1.5rem;
            border-left: 2px solid var(--color-primary);
            display: flex; justify-content: space-between; opacity: 0; 
        }
        .feed-label { color: var(--color-primary); font-weight: 700; }
        .feed-value { color: var(--color-text-dim); }

        /* --------------------------------------------------
           TEXT SECTIONS
           -------------------------------------------------- */
        .text-section p { max-width: 700px; margin: 0 auto 1.5rem auto; font-size: 1.15rem; line-height: 1.8; }
        .disclaimer-box {
            border: 1px solid #cf6679; background: rgba(207, 102, 121, 0.1);
            padding: 1rem; color: #cf6679; font-family: var(--font-code);
            font-size: 0.9rem; max-width: 700px; margin: 2rem auto; text-align: center;
        }
        .privacy-box {
            border: 1px solid var(--color-primary); background: rgba(0, 150, 136, 0.05);
            padding: 2rem; max-width: 800px; margin: 0 auto; text-align: left; border-radius: 8px;
        }
        .protocol-item {
            display: flex; align-items: flex-start; gap: 1rem;
            margin-bottom: 1.5rem; padding-bottom: 1.5rem; border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .protocol-item:last-child { border-bottom: none; margin-bottom: 0; }
        .protocol-icon { font-size: 1.5rem; color: var(--color-primary); }
        .protocol-title { color: #fff; font-weight: 700; font-family: var(--font-code); margin-bottom: 0.5rem; display: block; }
        .protocol-desc { font-size: 1rem; color: var(--color-text-dim); margin: 0; }

        footer {
            padding: 3rem 0; border-top: 1px solid rgba(255, 255, 255, 0.05);
            font-family: var(--font-code); font-size: 0.8rem;
            color: var(--color-text-dim); text-align: center;
        }

        @media (max-width: 768px) {
            .mapping-container { grid-template-columns: 1fr; }
            .header-
